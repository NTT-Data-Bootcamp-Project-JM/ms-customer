openapi: 3.0.3
info:
  title: Customers
  version: 1.0.0
  description: >
    Source of the customer API. The server interface is generated from this file.
    Personal, business, VIP, and PYME customers.
paths:
  /api/v1/customers:
    post:
      tags: [Customer]
      operationId: create
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [Customer]
      operationId: findAll
      summary: List customers
      responses:
        "200":
          description: All customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Customer]
      operationId: findById
      summary: Read one customer
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    put:
      tags: [Customer]
      operationId: update
      summary: Replace a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Customer]
      operationId: delete
      summary: Delete a customer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
components:
  securitySchemes:
    bearer-jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: A valid bearer token is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: A business rule rejected the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CustomerRequest:
      type: object
      required: [documentType, documentNumber, customerType, profile]
      properties:
        documentType:
          type: string
          enum: [DNI, CEX, PASSPORT, RUC]
        documentNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        businessName:
          type: string
        email:
          type: string
        phone:
          type: string
        customerType:
          type: string
          enum: [PERSONAL, BUSINESS]
        profile:
          type: string
          enum: [STANDARD, VIP, PYME]
    CustomerResponse:
      type: object
      properties:
        id:
          type: string
        documentType:
          type: string
          enum: [DNI, CEX, PASSPORT, RUC]
        documentNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        businessName:
          type: string
        email:
          type: string
        phone:
          type: string
        customerType:
          type: string
          enum: [PERSONAL, BUSINESS]
        profile:
          type: string
          enum: [STANDARD, VIP, PYME]
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
security:
  - bearer-jwt: []
